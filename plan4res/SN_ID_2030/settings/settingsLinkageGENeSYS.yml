##############################################################################
# inputs for creating the GENeSYS-MOD IAMC data out of julia outputs
##############################################################################

debug: ['Variable Cost with fuel|']
input_from_git: no
Model: GENeSYS-MOD 4.0

Scenarios:
    ID_2030:
        - ID_ID
Scenario: 'ID_2030'
years: [2025,2030,2035,2040,2045,2050]
#outputpath: /home/ahmany/om4a/p4rdata/data/SN_ID_2030/IAMC/

# LS : Louga Saint-Louis
# FKK : Fatick, Kaolack, Kaffrine
# ZS : Ziguinchor, Sédhiou
# MTKK : Matam, Tambacounda, Kolda et Kédougou

listregionsGET: ['World', 'Senegal', 'Dakar', 'Diourbel', 'Thies', 'LS', 'FKK', 'ZS', 'MTKK']
aggregateregions:  []# how to aggregate regions in plan4res dataset
global_region: World
# regional partitions in plan4res (partitions are used for coupling constraints)
partition:
    Countries: ['Senegal']
    Continent: ['World']
Add_Map_Region:
    World: World
    GM: Gambie
    MR: Mauritanie
    ML: Mali
    GN: Guinee
    GW: Guinee-Bissau

treat:
    fixed_data: yes
    hourly_data: no

genesys_datafiles:
    Scenario: ID_2030
    input: 
        inputfile: input_data_Senegal_ID_v2.xlsx
        Sheets: 
            - 'Sets'
            - 'Par_CapitalCost'
            - 'Par_CapitalCostStorage'
            - 'Par_FixedCost'
            - 'Par_AvailabilityFactor'
            - 'Par_EmissionActivityRatio'
            - 'Par_EmissionContentPerFuel'
            - 'Par_InputActivityRatio'
            - 'Par_OutputActivityRatio'
            - 'Par_OperationalLife'
            - 'Par_OperationalLifeStorage'
            - 'Par_TechnologyFromStorage'
            - 'Par_TechnologyToStorage'
            - 'Par_TagTechnologyToSector'
            - 'Par_TotalAnnualMaxCapacity'
            - 'Par_TradeCapacityGrowthCosts'
            - 'Par_TradeLossFactor'
            - 'Par_StorageE2PRatio'
    output:
        capacity: 'output_capacity_Senegal_ID_ID_inv_run.csv'
        annual_production: 'output_annual_production_Senegal_ID_ID_inv_run.csv'
        timeseries_production: 'output_production_Senegal_ID_ID_inv_run.csv'
        technology_costs: 'output_technology_costs_detailed_Senegal_ID_ID_inv_run.csv'
        trade_capacity: 'output_trade_capacity_Senegal_ID_ID_inv_run.csv'

# Regions
#######################################
# list of regions to get from data sources 

# Mapping
#######################################
    timeseries:
        xlsx: 'Hourly_Data_Senegal_v3.xlsx'
        sheets:
            'Final Energy|Electricity|Heat': 'TS_HEAT_LOW'
            'Final Energy|Electricity|Other (excl. Heat, Transport, Cooking)': 'TS_LOAD'
            'Final Energy|Electricity|Transportation': 'TS_MOBILITY_PSNG'
            #'Final Energy|Electricity|Cooking': 'TS_COOKING'
            'Electricity|Solar|PV|Rooftop|Commercial': 'TS_PV_AVG'
            'Electricity|Solar|PV|Utility|Average': 'TS_PV_AVG'
            'Electricity|Solar|PV|Utility|Inf': 'TS_PV_INF'
            'Electricity|Solar|PV|Utility|Opt': 'TS_PV_OPT'
            'Electricity|Wind|Offshore|Deep': 'TS_WIND_OFFSHORE_DEEP'
            'Electricity|Wind|Offshore|Shallow': 'TS_WIND_OFFSHORE_SHALLOW'
            'Electricity|Wind|Offshore|Transitional': 'TS_WIND_OFFSHORE'
            'Electricity|Wind|Onshore|Avg': 'TS_WIND_ONSHORE_AVG'
            'Electricity|Wind|Onshore|Opt': 'TS_WIND_ONSHORE_OPT'
            'Electricity|Hydro|Run of River': 'TS_HYDRO_ROR'   
# mappings for genesys-mod are
