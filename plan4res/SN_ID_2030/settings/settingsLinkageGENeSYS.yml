variables:
    Final Energy|Electricity|Heating:
        source: annual_production
        unit: 'PJ/yr'
        rules:
            select:
                Type:
                    values: [Use]
                Fuel:
                    values: [Power]
                Sector:
                    values: [Buildings]
            addvariablecol:
            apply_abs:
            group:
                rule: sum
            convert_unit: 
                to: 'EJ/yr'
                factor: 0.001
    Final Energy|Electricity|Industry:
        source: annual_production
        unit: 'PJ/yr'
        rules:
            select:
                Type:
                    values: [Use]
                Fuel:
                    values: [Power]
                Sector:
                    values: [Industry]
            addvariablecol:
            apply_abs:
            group:
                rule: sum
            convert_unit: 
                to: 'EJ/yr'
                factor: 0.001
    Final Energy|Electricity|Transportation:
        source: annual_production
        unit: 'PJ/yr'
        rules:
            select:
                Type:
                    values: [Use]
                Fuel:
                    values: [Power]
                Sector:
                    values: [Transportation]
            addvariablecol:
            apply_abs:
            group:
                rule: sum
            convert_unit: 
                to: 'EJ/yr'
                factor: 0.001
    Final Energy|Electricity|Other (excl. Heating, Industry, Transportation): 
        source: annual_production
        unit: 'PJ/yr'
        rules:
            select:
                Type:
                    values: [Use]
                Technology:
                    values: [Demand]
                Fuel:
                    values: [Power]
            addvariablecol:
            apply_abs:
            group:
                rule: sum
            convert_unit: 
                to: 'EJ/yr'
                factor: 0.001
    Final Energy|Electricity|Heat:
        source: internal
        unit: 'PJ/yr'
        rules:
            compute:
                ruleaggr: sum
                from: ['Final Energy|Electricity|Industry','Final Energy|Electricity|Heating']
    Final Energy|Electricity|Other:
        source: internal
        unit: 'PJ/yr'
        rules:
            compute:
                ruleaggr: sum
                from: ['Final Energy|Electricity|Industry','Final Energy|Electricity|Other (excl. Heating, Industry, Transportation)']
    Final Energy|Electricity:
        source: internal
        unit: 'PJ/yr'
        rules:
            compute: 
                from: ['Final Energy|Electricity|Other (excl. Heating, Industry, Transportation)','Final Energy|Electricity|Transportation','Final Energy|Electricity|Heating','Final Energy|Electricity|Industry']
                ruleaggr: sum  
    Network|Electricity|Maximum Flow:
        source: trade_capacity
        unit: GW
        rules:
            select:
                Type:
                    values: ['Power Transmissions Capacity']
            create_interco:
            addvariablecol:
            convert_unit: 
                to: 'MW'
                factor: 1000
    Network|Electricity|Expansion Cost:
        source: trade_capacity
        unit: 'million EUR/GW'
        rules:
            select:
                Type:
                    values: ['Transmission Expansion Costs in MEUR/GW']
            create_interco:
            addvariablecol:
            convert_unit: 
                to: 'EUR_2020/MW'
                factor: 1000
    Network|Electricity|Loss Factor:
        source: input
        sheets: [Par_TradeLossFactor]
        unit: '-'
        rules:
            global: True
            select:
                Fuel:
                    values: ['Power']
            addvariablecol:
    Secondary Energy without fuel|:
        source: annual_production
        unit: 'PJ/yr'
        rules:
            select:
                Type:
                    values: [Production]
                Fuel:
                    values: [Power]
            selectAndMap:
                column: Technology
                mappings: [technos]
                rule: sum
            removefuel:
            concatvariablename:   
            group:
                rule: sum
            convert_unit: 
                to: 'EJ/yr'
                factor: 0.001
            changevariablename:
                newname: Secondary Energy|
    Input Ratio|:
        source: input
        unit: '-'
        sheets: [Par_InputActivityRatio]
        rules:
            selectAndMap:
                columns: ['Technology','Fuel']
                mappings: [technofuels]
                rule: mean
            concatvariablename:
            global: True
    Secondary Energy with fuel|:
        source: annual_production
        unit: 'PJ/yr'
        rules:
            select:
                Type:
                    values: [Use]
                Sector:
                    values: [Power]
            selectAndMap:
                columns: ['Technology','Fuel']
                mappings: [technofuels]
            apply_abs:
            combinewithOtherVariable:
                Input Ratio|:
                    mapping: technofuels
                    rule: divide
            concatvariablename:   
            convert_unit: 
                to: 'EJ/yr'
                factor: 0.001
            changevariablename:
                newname: Secondary Energy|
    Capacity with fuel|:
        source: capacity
        unit: 'GW'
        rules:
            select:
                Type:
                    values: ['TotalCapacity']
                Sector:
                    values: ['Power','Storages','CHP']
            selectAndMap:
                column: Technology 
                mappings: [technos]
                rule: sum
            duplicatefuels:
            #combinewithOtherVariable:
            #    Secondary Energy|:
            #        mapping: technofuels
            #        rule: weight
            #        keep:
            concatvariablename:
            apply_abs:
            group:
                rule: sum
            changevariablename:
                newname: Capacity|
    Capacity without fuel|:
        source: capacity
        unit: 'GW'
        rules:
            select:
                Type:
                    values: ['TotalCapacity']
                Sector:
                    values: ['Power','Storages','CHP']
            selectAndMap:
                column: Technology 
                mappings: [technos]
                rule: sum
            removefuel:
            concatvariablename:
            apply_abs:
            group:
                rule: sum
            changevariablename:
                newname: Capacity|                    
    Variable Cost with fuel|:
        source: technology_costs
        unit: 'million EUR/PJ'
        rules:
            select:
                Type:
                    values: ['Variable Costs [incl. Fuel Costs]']
            selectAndMap:
                columns: ['Technology','Fuel']
                mappings: [technofuels]
                rule: mean           
            concatvariablename:
            group:
                rule: mean
            changevariablename:
                newname: Variable Cost|
            convert_unit: 
                to: 'EUR/MWh'
                factor: 3.6   
    Variable Cost without fuel|:
        source: technology_costs
        unit: 'million EUR/PJ'
        rules:
            select:
                Type:
                    values: ['Variable Costs [incl. Fuel Costs]']
            selectAndMap:
                column: Technology
                mappings: [technos]
                rule: mean           
            removefuel:
            concatvariablename:
            group:
                rule: mean
            changevariablename:
                newname: Variable Cost|
            convert_unit: 
                to: 'EUR/MWh'
                factor: 3.6
    Fixed Cost with fuel|:
        source: input
        unit: 'million EUR_2020/GW/yr'
        sheets: [Par_FixedCost]
        rules:
            selectAndMap:
                column: Technology
                mappings: [technos]
                rule: mean
            duplicatefuels:
            concatvariablename:
            global: True
            group:
                rule: mean
            convert_unit: 
                to: 'EUR_2020/kW/yr'
                factor: 1
            changevariablename:
                newname: Fixed Cost|
    Fixed Cost without fuel|:
        source: input
        unit: 'million EUR_2020/GW/yr'
        sheets: [Par_FixedCost]
        rules:                                              
            selectAndMap:
                column: Technology
                mappings: [technos]
                rule: mean
            removefuel:
            concatvariablename:
            global: True
            group:
                rule: mean
            convert_unit: 
                to: 'EUR_2020/kW/yr'
                factor: 1
            changevariablename:
                newname: Fixed Cost|               
    Capital Cost Storage|:
        source: input
        unit: 'million EUR_2020/PJ'
        sheets: [Par_CapitalCostStorage]
        rules:
            selectAndMap:
                column: Storage
                mappings: [storages]
                rule: mean
            concatvariablename:
            global: True
            group:
                rule: mean
            convert_unit: 
                to: 'EUR_2020/kW'
                factor: 0.0036
    Capital Cost Storage per Capacity|:
        source: internal
        unit: 'million EUR_2020/PJ'
        rules:
            compute:
                #mapping: storages_ratios
                mapping: StorageRatio
                from: ['Capital Cost Storage|']
                rulemap: mult
            convert_unit: 
                to: 'EUR_2020/kW'
                factor: 0.0036
    Capital Cost without Storage with fuel|:
        source: input
        unit: 'million EUR_2020/GW'
        sheets: [Par_CapitalCost]
        rules:
            selectAndMap:
                column: Technology
                mappings: [technos]
                rule: mean
            duplicatefuels:
            concatvariablename:            
            global: True
            group:
                rule: mean
            convert_unit: 
                to: 'EUR_2020/kW'
                factor: 1
            changevariablename:
                newname: Capital Cost without Storage|
    Capital Cost without Storage without fuel|:
        source: input
        unit: 'million EUR_2020/GW'
        sheets: [Par_CapitalCost]
        rules:
            selectAndMap:
                column: Technology
                mappings: [technos]
                rule: mean
            removefuel:
            concatvariablename:            
            global: True
            group:
                rule: mean
            convert_unit: 
                to: 'EUR_2020/kW'
                factor: 1
            changevariablename:
                newname: Capital Cost without Storage|
    Capital Cost|:
        source: internal
        unit: 'EUR_2020/kW'
        rules:
            compute:
                ruleaggr: sum
                mapping: IAMCtechnosWithFuels
